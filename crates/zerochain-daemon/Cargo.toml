[package]
name = "zerochain-daemon"
version.workspace = true
edition.workspace = true
readme = "../../README.md"
keywords = ["zerochain", "ai", "workflow"]
categories = ["development-tools"]
license.workspace = true
repository.workspace = true
description = "MCP server daemon for zerochain workflow execution"

[[bin]]
name = "zerochain"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
zerochain-engine = { path = "../zerochain-engine" }
zerochain-core = { path = "../zerochain-core" }
zerochain-llm = { path = "../zerochain-llm" }
zerochain-memory = { path = "../zerochain-memory" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
clap = { version = "4.0", features = ["derive", "env"] }
rmcp.workspace = true
schemars.workspace = true

[dev-dependencies]
async-trait.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["rt", "macros", "fs"] }
zerochain-cas = { path = "../zerochain-cas" }
zerochain-fs = { path = "../zerochain-fs" }
zerochain-llm = { path = "../zerochain-llm" }
